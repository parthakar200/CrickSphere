<aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <div class="sidebar__brand">
    <div class="sidebar__logo">
      <span class="material-icons">sports_cricket</span>
    </div>
    @if (!collapsed()) {
      <span class="sidebar__brand-name font-display">CrickSphere</span>
    }
  </div>

  <nav class="sidebar__nav">
    @for (item of visibleItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="sidebar__link"
        [attr.title]="collapsed() ? item.label : null"
      >
        <span class="material-icons sidebar__icon">{{ item.icon }}</span>
        @if (!collapsed()) {
          <span class="sidebar__label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <button type="button" class="sidebar__collapse-toggle" (click)="toggle()" [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
    <span class="material-icons">{{ collapsed() ? 'chevron_right' : 'chevron_left' }}</span>
  </button>
</aside>
